name: Build BE72Pro + FanchmWrt fwx

on:
  workflow_dispatch:
    inputs:
      with_kmod:
        description: '编译 fwx.ko（DPI 内核模块）'
        type: choice
        options: ['yes', 'no']
        default: 'yes'
  push:
    branches: [main]
    paths:
      - 'defconfig/**'
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: be72-fwx-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  WORKDIR: /mnt/build/work

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Prepare work dir on /mnt
        run: |
          sudo mkdir -p /mnt/build
          sudo chown -R "$USER":"$(id -gn)" /mnt/build
          df -h /mnt

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache clang clangd cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5 \
            libncursesw5-dev libncurses-dev libpython3-dev libreadline-dev \
            libssl-dev libtool libyaml-dev libz-dev lld lldb llvm lrzsz mkisofs \
            msmtp nano ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 \
            python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils \
            re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone "$TZ"

      - name: Build
        env:
          WITH_KMOD: ${{ github.event.inputs.with_kmod == 'no' && '0' || '1' }}
          JOBS: 4
        run: |
          chmod +x scripts/build.sh
          bash scripts/build.sh

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out
          BIN="$WORKDIR/MT798X-6.6-24.10/bin/targets/mediatek/filogic"
          cp -v "$BIN"/*be72*sysupgrade.bin out/ 2>/dev/null || true
          cp -v "$BIN"/sha256sums out/ 2>/dev/null || true
          ls -lh out || true

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: be72pro-fwx-${{ github.run_number }}
          path: out/*
          retention-days: 30

      - name: Upload build log
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: |
            /mnt/build/work/build.log
            /mnt/build/work/kernel-prepare.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BE72Pro+fwx #${{ github.run_number }}
          prerelease: true
          body: |
            Ruijie RG-BE72 Pro · immortalwrt-mt798x 6.6 + FanchmWrt fwx

            - 基础固件：RuijieNetworksCommunity/MT798X-6.6-24.10 @ 401e2ba
            - fwx 来源：fanchmwrt 11b65ca / fanchmwrt-packages 59c6b96
            - 内核模块：${{ github.event.inputs.with_kmod == 'no' && '未编译（降级版）' || '已编译' }}

            刷机：`sysupgrade -n <文件>`（必须是 232.5 MiB 布局；stock 112.5M 布局不要刷）
          files: out/*
