name: Build BE72Pro + FanchmWrt fwx

on:
  workflow_dispatch:
    inputs:
      with_kmod:
        description: '编译 fwx.ko（DPI 内核模块）'
        type: choice
        options: ['yes', 'no']
        default: 'yes'
      style_cards:
        description: '全站视觉统一（设 no 可回到 fanchmwrt 原样）'
        type: choice
        options: ['yes', 'no']
        default: 'yes'
      all_kmods:
        description: '编译树里全部内核模块（设 no 显著加快构建，代价是冷门 kmod 不进包）'
        type: choice
        options: ['yes', 'no']
        default: 'yes'
  push:
    branches: [main]
    paths:
      - 'defconfig/**'
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: be72-fwx-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  WORKDIR: /mnt/build/work

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Prepare work dir on /mnt
        run: |
          sudo mkdir -p /mnt/build
          sudo chown -R "$USER":"$(id -gn)" /mnt/build
          df -h /mnt

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache clang clangd cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5 \
            libncursesw5-dev libncurses-dev libpython3-dev libreadline-dev \
            libssl-dev libtool libyaml-dev libz-dev lld lldb llvm lrzsz mkisofs \
            msmtp nano ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 \
            python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils \
            re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone "$TZ"

      - name: Build
        env:
          WITH_KMOD: ${{ github.event.inputs.with_kmod == 'no' && '0' || '1' }}
          STYLE_CARDS: ${{ github.event.inputs.style_cards == 'no' && '0' || '1' }}
          ALL_KMODS: ${{ github.event.inputs.all_kmods == 'no' && '0' || '1' }}
          JOBS: 4
        run: |
          chmod +x scripts/build.sh
          bash scripts/build.sh

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out/ipk
          BIN="$WORKDIR/MT798X-6.6-24.10/bin/targets/mediatek/filogic"
          PKGROOT="$WORKDIR/MT798X-6.6-24.10/bin/packages"
          cp -v "$BIN"/*be72*sysupgrade.bin out/ 2>/dev/null || true
          # 包清单：排查「某个功能没编进去」时最直接的依据（ppp / kmod-* / luci-mod-*）
          cp -v "$BIN"/*be72*.manifest out/ 2>/dev/null || true
          cp -v "$BIN"/sha256sums out/ 2>/dev/null || true

          # ---- 可增量安装的包（免刷机升级用）----
          # 这些改动用 scripts/router-upgrade.sh 在路由器上 opkg 装即可，不必刷整机：
          #   fwxd              接口 / rule_manager.lua / 两个 uci 配置 / 特征库
          #   fwx.ko            DPI 内核模块（要求内核版本与本次构建一致）
          #   luci-app-fwx-*    17 个页面（含 l10n）
          #   luci-theme       设计系统样式层
          # 树内包的 ipk 落在 bin/packages/<arch>/base/，内核模块在 bin/targets/.../kmods/；
          # 这里用 find 兜底，避免 feed 目录名变化导致漏拷。
          for pat in 'fwxd_*.ipk' 'libfwx_common_*.ipk' \
                     'kmod-fwx_*.ipk' 'kmod-nft-fullcone_*.ipk' \
                     'luci-app-fwx-*_*.ipk' 'luci-i18n-fwx-*_*.ipk' \
                     'luci-theme-fanchmwrt_*.ipk'; do
            find "$PKGROOT" "$BIN/kmods" -maxdepth 3 -name "$pat" \
              -exec cp -v {} out/ipk/ \; 2>/dev/null || true
          done
          cp -v "$GITHUB_WORKSPACE/scripts/router-upgrade.sh" out/ipk/ 2>/dev/null || true
          echo "---- out/ipk ----"
          ls -lh out/ipk || true
          echo "---- out ----"
          ls -lh out || true

      - name: Build ipk bundle
        if: always()
        run: |
          # 把上面收集的 ipk 打成一个整合包：路由器上 wget + sh 一条命令装完
          bash scripts/make_bundle.sh out/ipk out "${{ github.run_number }}" \
            "$WORKDIR/MT798X-6.6-24.10" || echo "[warn] 整合包生成失败（不影响固件产物）"
          # 在线升级器本身也一起发（只需装到路由器一次）
          cp -v scripts/fwx-update.sh out/ 2>/dev/null || true
          ls -lh out/*.tar.gz* 2>/dev/null || true

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: be72pro-fwx-${{ github.run_number }}
          path: |
            out/*.bin
            out/*.manifest
            out/sha256sums
            out/ipk/*
            out/*.tar.gz
            out/*.tar.gz.sha256
            out/fwx-update.sh
          retention-days: 30

      - name: Upload build log
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: |
            /mnt/build/work/build.log
            /mnt/build/work/kernel-prepare.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "BE72Pro+fwx #${{ github.run_number }}"
          prerelease: true
          body: |
            Ruijie RG-BE72 Pro · immortalwrt-mt798x 6.6 + FanchmWrt fwx

            - 基础固件：RuijieNetworksCommunity/MT798X-6.6-24.10 @ 401e2ba
            - fwx 来源：fanchmwrt **24.10.4** @ 9640f14 / fanchmwrt-packages @ 3c6ae71（与 fwxd 同期）
            - 内核补丁：上游 980（nf_conn 字段）；981 经核实是死代码，未使用
            - 内核模块：${{ github.event.inputs.with_kmod == 'no' && '未编译（降级版）' || '已编译' }}
            - 全部内核模块：${{ github.event.inputs.all_kmods == 'no' && '否（构建提速版，冷门 kmod 不进包）' || '是' }}

            **刷整机**（内核/DTS/底座变化时必须）：`sysupgrade -n <sysupgrade.bin>`（232.5 MiB 布局）

            **免刷机升级 · 整合包**（推荐，一个文件搞定）：
            ```
            # 路由器上执行（需外网；国内慢可用 --url 指向自建镜像）
            wget -O /tmp/pkg.tar.gz <本页 be72pro-fwx-pkg-*.tar.gz 的直链>
            mkdir -p /tmp/pkg && tar -xzf /tmp/pkg.tar.gz -C /tmp/pkg
            sh /tmp/pkg/be72pro-fwx-pkg-*/install.sh
            ```
            或装一次在线升级器 `fwx-update.sh` 到 `/usr/sbin/fwx-update`，之后只需：
            ```
            fwx-update --check    # 看有没有新版
            fwx-update            # 下载+校验+安装
            ```

            **免刷机升级 · 散装 ipk**：
            ```
            scp -r ipk/ root@路由器:/tmp/ipk
            ssh root@路由器 'sh /tmp/ipk/router-upgrade.sh'
            ```
            整合包与本机固件必须是同一次构建产出（会校验内核版本，不匹配会拒绝安装）。
          files: |
            out/*.bin
            out/*.manifest
            out/sha256sums
            out/ipk/*
            out/*.tar.gz
            out/*.tar.gz.sha256
            out/fwx-update.sh
