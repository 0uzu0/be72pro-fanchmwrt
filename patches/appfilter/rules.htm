<%#
 应用过滤（设计基准 #v-appfilter，重新整合布局）
 真实数据：get_filter_rules（现有规则）+ active_app（实时应用监控）
 说明：get_class_list 在 24.10.4 不存在，无法做分类勾选，改为「活跃应用一键禁止」
-%>
<%+header%>
<div class="fwx-af">
	<div class="ds-grid ds-col2">
		<div class="ds-card">
			<h3>过滤规则 <span class="ds-tag" id="af-count">--</span></h3>
			<div class="ds-hint">规则由应用维度匹配（app_id）；被拒绝的应用立即断连并记录审计。</div>
			<table class="tbl"><thead><tr><th>规则</th><th>应用</th><th>动作</th></tr></thead>
			<tbody id="af-body"><tr><td colspan="3" class="ds-hint-td">加载中…</td></tr></tbody></table>
		</div>
		<div class="ds-card">
			<h3>活跃应用 <a class="more" href="<%=url("admin/fwx_parental_control/advance")%>">高级设置</a></h3>
			<div class="ds-hint">实时连接中的应用，点「禁止」立即加入过滤规则。</div>
			<div class="dev-list" id="af-live"><div class="sub-text">加载中…</div></div>
		</div>
	</div>
</div>
<style>
.fwx-af .ds-grid{display:grid;gap:13px}
.fwx-af .ds-col2{grid-template-columns:repeat(2,minmax(0,1fr))}
.fwx-af .ds-card{background:var(--ds-panel,#fff);border:1px solid var(--ds-line,rgba(31,35,40,.1));border-radius:var(--ds-r-lg,16px);padding:17px 19px}
.fwx-af h3{font-size:12.5px;font-weight:500;color:var(--ds-text2,#59636e);margin:0 0 9px;display:flex;gap:8px;align-items:center}
.fwx-af h3 .more{margin-left:auto;font-size:11.5px;color:var(--ds-accent,#0a7cff);text-decoration:none}
.fwx-af .ds-tag{padding:1px 8px;border-radius:99px;font-size:11px;background:var(--ds-panel2,#f6f8fa);color:var(--ds-text2,#59636e)}
.fwx-af .ds-hint{font-size:11px;color:var(--ds-text3,#818b98);margin-bottom:11px}
.fwx-af .tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.fwx-af .tbl th{text-align:left;font-weight:500;color:var(--ds-text2,#59636e);font-size:11.5px;padding:9px 10px;border-bottom:1px solid var(--ds-line,rgba(31,35,40,.1))}
.fwx-af .tbl td{padding:10px;border-bottom:1px solid var(--ds-line,rgba(31,35,40,.06))}
.fwx-af .ds-hint-td{text-align:center;color:var(--ds-text3,#818b98);font-size:12px;padding:14px}
.fwx-af .dev-list{display:flex;flex-direction:column;gap:9px}
.fwx-af .dev-row{display:flex;align-items:center;gap:10px}
.fwx-af .dev-ico{width:28px;height:28px;border-radius:9px;background:var(--ds-panel2,#f6f8fa);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ds-text2,#59636e)}
.fwx-af .dev-main{flex:1;min-width:0}
.fwx-af .dev-main .nm{font-size:12.5px;color:var(--ds-text,#1f2328)}
.fwx-af .dev-main .meta{font-size:11px;color:var(--ds-text3,#818b98);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fwx-af .btn{padding:5px 12px;border:none;border-radius:8px;cursor:pointer;font-size:11.5px;background:#d33;color:#fff}
.fwx-af .sub-text{font-size:11px;color:var(--ds-text3,#818b98)}
@media (max-width:900px){.fwx-af .ds-col2{grid-template-columns:1fr}}
</style>
<script>
(function(){
	var $=function(i){return document.getElementById(i);};
	function api(u,p){return new Promise(function(r){try{new XHR().get(u,p,function(x,b){try{r(JSON.parse(b));}catch(e){r(null);}});}catch(e){r(null);}});}
	function post(u,d){return new Promise(function(r){try{new XHR().post(u,d,function(x,b){try{r(JSON.parse(b));}catch(e){r(null);}});}catch(e){r(null);}});}
	function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
	api('<%=url("admin/fwx/get_filter_rules")%>',{}).then(function(r){
		var list=(r&&r.data&&r.data.list)||[];
		$('af-count').textContent=list.length+' 条';
		var box=$('af-body');
		if(!list.length){box.innerHTML='<tr><td colspan="3" class="ds-hint-td">还没有过滤规则</td></tr>';return;}
		box.innerHTML=list.map(function(x){
			var appname=x.app_name||x.name||('应用 '+(x.app_id!=null?x.app_id:'--'));
			var act=String(x.action)==='0'?'拒绝':'允许';
			return '<tr><td>'+esc(x.id!=null?x.id:'--')+'</td><td>'+esc(appname)+'</td><td>'+act+'</td></tr>';
		}).join('');
	});
	function loadLive(){
		api('<%=url("admin/fwx/get_dashboard_common")%>',{}).then(function(r){
			var d=r&&r.data&&r.data.active_app;
			var list=(d&&d.list)||[];
			var box=$('af-live');
			if(!list.length){box.innerHTML='<div class="sub-text">当前无活跃连接</div>';return;}
			var seen={};
			box.innerHTML=list.filter(function(a){if(!a.name||seen[a.name])return false;seen[a.name]=1;return true;}).slice(0,8).map(function(a){
				return '<div class="dev-row"><div class="dev-ico">'+esc(String(a.name).slice(0,1))+'</div>'+
				'<div class="dev-main"><div class="nm">'+esc(a.name)+'</div><div class="meta">'+esc(a.domain||a.mac||'')+'</div></div>'+
				'<button class="btn" data-app="'+esc(a.id)+'">禁止</button></div>';
			}).join('');
			Array.prototype.forEach.call(box.querySelectorAll('.btn[data-app]'),function(b){
				b.addEventListener('click',function(){
					post('<%=url("admin/fwx/add_filter_rule")%>',{app_id:Number(b.getAttribute('data-app')),action:0}).then(function(){loadLive();});
				});
			});
		});
	}
	loadLive();setInterval(loadLive,8000);
})();
</script>
<%+footer%>
